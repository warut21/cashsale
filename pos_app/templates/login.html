{% extends "layout_auth.html" %}

{% block title %}POS Login{% endblock %}

{% block head_extra %}
<style>
    /* Custom styles for login page, can be moved to style.css if preferred */
    html, body {
        height: 100%;
    }
    body {
        display: flex;
        align-items: center;
        padding-top: 40px;
        padding-bottom: 40px;
        background-color: #f5f5f5;
    }
    .form-signin {
        width: 100%;
        max-width: 330px;
        padding: 15px;
        margin: auto;
    }
    .form-signin .form-floating:focus-within {
        z-index: 2;
    }
    .form-signin input[type="text"] {
        margin-bottom: -1px;
        border-bottom-right-radius: 0;
        border-bottom-left-radius: 0;
    }
    .form-signin input[type="password"] {
        margin-bottom: 10px;
        border-top-left-radius: 0;
        border-top-right-radius: 0;
    }
</style>
{% endblock %}

{% block content %}
<main class="form-signin text-center">
    <form id="loginForm">
        <h1 class="h3 mb-3 fw-normal">Please sign in</h1>

        <div class="form-floating">
            <input type="text" class="form-control" id="sales_id" name="sales_id" placeholder="Sales ID" required autofocus>
            <label for="sales_id">Sales ID</label>
        </div>
        <div class="form-floating">
            <input type="password" class="form-control" id="sales_password" name="sales_password" placeholder="Password" required>
            <label for="sales_password">Password</label>
        </div>

        <button class="w-100 btn btn-lg btn-primary" type="submit">Login</button>
        
        <div id="errorMessage" class="mt-3 text-danger"></div>
    </form>
</main>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
