<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Login</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f4; }
        .login-container { background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        label { display: block; margin-bottom: 5px; color: #555; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        #errorMessage { color: red; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>POS Login</h2>
        <form id="loginForm">
            <div>
                <label for="sales_id">Sales ID:</label>
                <input type="text" id="sales_id" name="sales_id" required>
            </div>
            <div>
                <label for="sales_password">Password:</label>
                <input type="password" id="sales_password" name="sales_password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <div id="errorMessage"></div>
    </div>

    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
