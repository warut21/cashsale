{% extends "layout.html" %}

{% block title %}Customer Management{% endblock %}

{% block head_extra %}
<style>
    /* Optional: Page-specific styles for customers.html */
    .search-results-area {
        max-height: 400px;
        overflow-y: auto;
    }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <h2 class="mb-4">Customer Management</h2>

    <div class="row">
        <!-- Add New Customer Section -->
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">
                    Add New Customer
                </div>
                <div class="card-body">
                    <form id="addCustomerForm">
                        <div class="mb-3">
                            <label for="newCustId" class="form-label">Customer ID</label>
                            <input type="text" class="form-control" id="newCustId" required>
                        </div>
                        <div class="mb-3">
                            <label for="newCustName" class="form-label">Customer Name</label>
                            <input type="text" class="form-control" id="newCustName" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Add Customer</button>
                    </form>
                    <div id="addCustomerMessage" class="mt-3"></div>
                </div>
            </div>
        </div>

        <!-- Search and Display Customers Section -->
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    Search & View Customers
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label for="customerSearchTerm" class="form-label">Search by ID or Name</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="customerSearchTerm" placeholder="Enter ID or Name">
                            <button class="btn btn-outline-secondary" type="button" id="searchCustomerBtn">Search</button>
                        </div>
                    </div>
                    <div id="customerSearchMessage" class="mb-3"></div>
                    <div class="search-results-area">
                        <ul id="customerList" class="list-group">
                            <!-- Customer items will be populated here by JavaScript -->
                            <li class="list-group-item text-muted">Search to display customers.</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/customers.js') }}"></script>
{% endblock %}
